<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Us — Northwind Labs</title>
</head>
<body>
  <h1>Contact Us</h1>
  <p>Have a question about our product? Send us a message and our team will get back to you.</p>

  <form id="contact-form">
    <label for="c-name">Name</label>
    <input type="text" id="c-name" name="name" required />

    <label for="c-email">Email</label>
    <input type="email" id="c-email" name="email" required />

    <label for="c-subject">Subject</label>
    <input type="text" id="c-subject" name="subject" />

    <label for="c-message">Message</label>
    <textarea id="c-message" name="message" rows="5"></textarea>

    <button type="submit">Send Message</button>
  </form>
</body>
</html>
