<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Backend Engineer Application</title>
</head>
<body>
  <h1>Backend Engineer Application</h1>

  <form id="captcha-form">
    <label for="cap-name">Full name</label>
    <input type="text" id="cap-name" name="name" />

    <label for="cap-email">Email address</label>
    <input type="email" id="cap-email" name="email" autocomplete="email" />

    <div class="g-recaptcha" data-sitekey="synthetic-test-key"></div>
    <p class="hint">Please complete the captcha to continue.</p>

    <button type="submit">Apply now</button>
  </form>
</body>
</html>
