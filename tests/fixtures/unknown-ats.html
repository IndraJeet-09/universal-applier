<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Apply — Backend Engineer | StartupXYZ</title>
</head>
<body>
  <h1>Backend Engineer</h1>
  <div class="company-name">StartupXYZ</div>
  <p class="location">Remote</p>
  <p>Full-time · Engineering · 3+ years experience</p>

  <div class="application-form">
    <div class="field-container" data-field="candidate_name">
      <label class="field-label" for="f-8d21c">Your name</label>
      <input type="text" id="f-8d21c" name="candidate_name" class="input-text" />
    </div>

    <div class="field-container" data-field="candidate_email">
      <label class="field-label" for="f-91af2">Email</label>
      <input type="email" id="f-91af2" name="candidate_email" class="input-text" />
    </div>

    <div class="field-container" data-field="candidate_phone">
      <label class="field-label" for="f-33ba1">Phone number</label>
      <input type="text" id="f-33ba1" name="candidate_phone" class="input-text" />
    </div>

    <div class="field-container" data-field="field_3928">
      <label class="field-label" for="f-44c0d">Where can we find your code?</label>
      <input type="text" id="f-44c0d" name="field_3928" class="input-text"
             placeholder="https://github.com/..." />
    </div>

    <div class="field-container" data-field="field_1102">
      <label class="field-label" for="f-77ee0">How many years have you worked professionally?</label>
      <input type="text" id="f-77ee0" name="field_1102" class="input-text" />
    </div>

    <div class="field-container" data-field="field_5510">
      <label class="field-label" for="f-aa310">What is your expected annual salary?</label>
      <input type="text" id="f-aa310" name="field_5510" class="input-text" />
    </div>

    <div class="field-container" data-field="resume">
      <label class="field-label" for="f-resume">Resume</label>
      <input type="file" id="f-resume" name="resume" accept=".pdf,.docx" />
    </div>

    <div class="field-container" data-field="field_6600">
      <label class="field-label" for="f-bb010">Why are you interested in this position?</label>
      <textarea id="f-bb010" name="field_6600" rows="5"></textarea>
    </div>

    <div class="actions">
      <input type="submit" value="Submit application" class="btn" />
    </div>
  </div>
</body>
</html>
